<!doctype html><html><head><meta charset="utf-8"><title>Personal Expense Tracker</title>
<style>body{font-family:Arial;max-width:900px;margin:30px auto;padding:0 18px;background:#f7f7f7}
nav{background:#243447;padding:14px}nav a{color:white;margin-right:18px;text-decoration:none}
.card{background:white;padding:20px;margin:18px 0;border-radius:10px;box-shadow:0 2px 8px #ddd}
input,select,textarea{padding:9px;margin:5px 0;width:100%;box-sizing:border-box}
button{padding:10px 18px;background:#243447;color:white;border:0;border-radius:6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}</style></head><body>
<nav><a href="/">Home</a>{% if user.is_authenticated %}<a href="/transaction/add/">Add Transaction</a><a href="/bills/">Bills</a><a href="/feedback/">Feedback</a><a href="/logout/">Logout</a>{% else %}<a href="/login/">Login</a><a href="/register/">Register</a>{% endif %}</nav>
{% block content %}{% endblock %}</body></html>
